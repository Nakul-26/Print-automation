# Included in every location that serves the app itself (nginx drops server-level add_header
# in a location that sets its own, so this file is included explicitly).
#
# The order link in the address bar is a secret, so no referrer is ever sent.
# Scripts, styles and fonts come only from this site; the one external origin is Cloudflare
# Turnstile (the bot check). blob: is for the PDF preview and its worker.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: ws: wss:; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
