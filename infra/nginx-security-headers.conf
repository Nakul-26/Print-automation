# Included in every location that serves the app itself (nginx drops server-level add_header
# in a location that sets its own, so this file is included explicitly).
#
# The order link in the address bar is a secret, so no referrer is ever sent.
# Scripts, styles and fonts come only from this site. The external origins are Cloudflare Turnstile
# (the bot check) and Razorpay Checkout (the payment window, loaded only when a student pays online).
# blob: is for the PDF preview and its worker.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.razorpay.com; font-src 'self'; connect-src 'self' blob: ws: wss: https://lumberjack.razorpay.com https://api.razorpay.com; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(self "https://api.razorpay.com" "https://checkout.razorpay.com"), usb=()' always;
add_header Strict-Transport-Security "max-age=31536000" always;
