# Local development services. Production is deployed through Dokploy (see compose.prod.yaml).
name: print-platform-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: print
      POSTGRES_PASSWORD: print
      POSTGRES_DB: print
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U print -d print']
      interval: 5s
      timeout: 3s
      retries: 10

  # Ghostscript + LibreOffice. The API pipes documents through `docker exec -i print-tools ...`
  # when GS_COMMAND / OFFICE_COMMAND are set accordingly (see apps/api/.env.example).
  tools:
    build:
      context: .
      dockerfile: tools.Dockerfile
    container_name: print-tools
    restart: unless-stopped
    volumes:
      - ./office:/opt/print-convert:ro

volumes:
  pgdata:
