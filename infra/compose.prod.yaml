# Production stack for Dokploy (or any Docker host): web (nginx) + api + postgres.
#
# Dokploy: create a "Compose" application from this repository, set the compose path to
# infra/compose.prod.yaml, fill in the environment variables from infra/.env.production.example,
# and attach your domain to the `web` service on port 80 (Dokploy's proxy provides HTTPS).
# Do not publish PostgreSQL's port.

name: print-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-print}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-print}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Web + API only. Heavy document work happens in `worker`, so page loads stay quick.
  api: &api
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      APP_ROLE: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-print}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-print}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN, e.g. https://print.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ random characters)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_MAX_BYTES: ${STORAGE_MAX_BYTES:-5368709120}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      # Leave unset to size from the container's CPU and memory (recommended).
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      OFFICE_CONCURRENCY: ${OFFICE_CONCURRENCY:-}
      JOB_MEMORY_MB: ${JOB_MEMORY_MB:-600}
      PREVIEW_CONCURRENCY: ${PREVIEW_CONCURRENCY:-}
      PREVIEW_MAX_WAITING: ${PREVIEW_MAX_WAITING:-30}
    volumes:
      - files:/data
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}

  # Runs the queued jobs: PDF clean-up, Word/Excel/PowerPoint conversion (LibreOffice), order
  # preparation and the retention sweep. This is the part to scale: set WORKER_REPLICAS, and
  # keep (CPU cores - 1) >= replicas x concurrency per replica. More workers than the server
  # has cores makes every job slower, not faster. All replicas share the `files` volume, so
  # they must run on the same host (a multi-host setup needs S3-style storage first).
  worker:
    <<: *api
    environment:
      <<: *api-env
      APP_ROLE: worker
    # The worker has no public port; the probe in the image checks the same /health.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-3g}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  files:
