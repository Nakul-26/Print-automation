# Serves the React app and forwards API traffic, so browser and API share one origin
# (cookies need no CORS, and the app uses relative URLs).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Visitors arrive through Cloudflare, then Dokploy's proxy, so the address nginx sees is always an
# internal one. Cloudflare puts the visitor's real address in CF-Connecting-IP; trust it only when
# the request comes from a private network (never directly from the internet), so rate limits
# apply per visitor instead of to everybody at once.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header CF-Connecting-IP;

# Docker gives a restarted container a new address. Re-resolve "api" every few seconds instead of
# once at start-up, or nginx keeps sending traffic to the old address (a 502, or worse, another
# container that has taken it over) until nginx itself is restarted.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The PDF preview worker is an .mjs module; browsers refuse module scripts that are not served
  # as JavaScript (and we send nosniff).
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  # Slightly above MAX_UPLOAD_BYTES (20 MB) so the API produces the friendly "too large" error.
  client_max_body_size 25m;

  # Document conversion can take a while; uploads stream straight through.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_request_buffering off;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /socket.io/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
