# Serves the React app and forwards API traffic, so browser and API share one origin
# (cookies need no CORS, and the app uses relative URLs).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The PDF preview worker is an .mjs module; browsers refuse module scripts that are not served
  # as JavaScript (and we send nosniff).
  include /etc/nginx/mime.types;
  types {
    text/javascript mjs;
  }

  # Slightly above MAX_UPLOAD_BYTES (20 MB) so the API produces the friendly "too large" error.
  client_max_body_size 25m;

  # Document conversion can take a while; uploads stream straight through.
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;
  proxy_request_buffering off;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
